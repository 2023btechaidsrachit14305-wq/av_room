name: Flask Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile app.py firebase_service.py seed.py
      - name: Check required Firebase configuration references
        run: python -c "from pathlib import Path; assert Path('static/js/firebase.js').exists(); assert Path('firestore.rules').exists(); print('Firebase integration files present')"
