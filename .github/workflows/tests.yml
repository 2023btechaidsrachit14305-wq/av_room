name: Flask Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile app.py seed.py
      - name: Seed test database
        run: DATABASE_URL=sqlite:///ci_av_room.db ADMIN_USERNAME=ci_admin ADMIN_PASSWORD=ci_password_123 python seed.py
      - name: Import application
        run: DATABASE_URL=sqlite:///ci_av_room.db python -c "from app import app; print(app.url_map)"
