name: Flask Health Check

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile application
        run: python -m py_compile app.py seed.py
      - name: Seed a clean demo database
        run: DATABASE_URL=sqlite:///ci_av_room.db ADMIN_USERNAME=ci_admin ADMIN_PASSWORD=ci_password_123 python seed.py
